name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

# Requires Settings → Pages → Source set to "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never publish a build that fails the gates.
      - run: npm run check
      # The graybox keeps its existing URL under spikes/.
      - run: cp -r spikes dist/spikes && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
